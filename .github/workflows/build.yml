name: Godot prototype checks and builds
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      GODOT_VERSION: 4.5.2
      GODOT: /tmp/godot/Godot_v4.5.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot
          curl -fsSL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo '87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "$GODOT"
          curl -fsSL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz -o /tmp/templates.tpz
          echo 'ea50e5183f057d42b22120d0d0340205b98f51f8ff13c33c70fd4ac9077d2019  /tmp/templates.tpz' | sha256sum -c -
          python3 - <<'PY'
          import os, pathlib, zipfile
          dest=pathlib.Path.home()/'.local/share/godot/export_templates/4.5.2.stable'
          dest.mkdir(parents=True,exist_ok=True)
          wanted={'web_nothreads_release.zip','web_nothreads_debug.zip','windows_release_x86_64.exe','windows_debug_x86_64.exe','version.txt'}
          with zipfile.ZipFile('/tmp/templates.tpz') as archive:
              for name in archive.namelist():
                  if pathlib.Path(name).name in wanted:
                      (dest/pathlib.Path(name).name).write_bytes(archive.read(name))
          PY
      - name: Stamp visible game version
        run: python3 -c 'import json,os,pathlib; pathlib.Path("data/build.json").write_text(json.dumps({"version":"0.2."+os.environ["GITHUB_RUN_NUMBER"]}))'
      - name: Import, rule tests, save tests, full route and UI smoke
        run: python3 scripts/ci_check.py
      - name: Capture desktop interface
        run: |
          mkdir -p build/screenshots
          xvfb-run -a "$GODOT" --path . --audio-driver Dummy -- --capture
      - name: Export Web and Windows
        run: |
          mkdir -p build/web build/windows build/launcher
          "$GODOT" --headless --path . --export-release Web build/web/index.html
          "$GODOT" --headless --path . --export-release "Windows Desktop" build/windows/toy-dg.exe
          "$GODOT" --headless --path . --export-release "Windows Launcher" build/launcher/ToyDG-Launcher.exe
          cp THIRD_PARTY_NOTICES.md build/web/
          cp THIRD_PARTY_NOTICES.md build/windows/
          cp assets/fonts/OFL.txt build/web/
          cp assets/fonts/OFL.txt build/windows/
          test -s build/web/index.wasm
          test -s build/windows/toy-dg.exe
      - name: Package versioned release
        id: package
        run: |
          version="0.2.${GITHUB_RUN_NUMBER}"
          python3 scripts/package_release.py "$version" "$GITHUB_SHA"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toy-dg-release
          path: build/release/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toy-dg-launcher
          path: build/launcher/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toy-dg-web
          path: build/web/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toy-dg-windows
          path: build/windows/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: toy-dg-screenshots
          path: build/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  windows-smoke:
    needs: test-and-export
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: toy-dg-release
          path: release
      - name: Run the exported Windows game and launcher
        shell: pwsh
        run: |
          Expand-Archive release/toy-dg-windows.zip game
          Expand-Archive release/toy-dg-launcher.zip launcher
          function Test-Executable($exe, $flag, $marker, $name) {
            $process = Start-Process -FilePath (Resolve-Path $exe).Path -ArgumentList "--headless", "--", $flag -RedirectStandardOutput "$name-out.txt" -RedirectStandardError "$name-err.txt" -PassThru
            if (-not $process.WaitForExit(90000)) { $process.Kill(); throw "$name timed out" }
            $text = (Get-Content "$name-out.txt" -Raw) + (Get-Content "$name-err.txt" -Raw)
            Write-Output $text
            if ($process.ExitCode -ne 0 -or $text -notmatch $marker -or $text -match "SCRIPT ERROR:|ERROR:") { throw "$name failed" }
          }
          Test-Executable "./game/toy-dg.exe" "--smoke" "UI_SMOKE_OK" "game"
          Test-Executable "./launcher/ToyDG-Launcher.exe" "--launcher-smoke" "LAUNCHER_SMOKE_OK" "launcher"

  publish:
    needs: [test-and-export, windows-smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: toy-dg-release
          path: release
      - name: Publish complete release after validation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.test-and-export.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > existing.txt 2>/dev/null; then
            if [ "$(cat existing.txt)" = "false" ]; then
              echo "Published release already exists; leaving its bytes unchanged."
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "地城拾遗 $tag" --notes-file release/release-notes.md
          fi
          gh release upload "$tag" release/toy-dg-windows.zip release/toy-dg-launcher.zip release/toy-dg-web.zip release/toy-dg-previews.zip release/update.json --clobber
          gh release edit "$tag" --draft=false --latest

  live-update:
    needs: publish
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: toy-dg-release
          path: release
      - name: Verify public update download, install and game startup on Windows
        shell: pwsh
        run: |
          Expand-Archive release/toy-dg-launcher.zip launcher
          $process = Start-Process -FilePath (Resolve-Path "./launcher/ToyDG-Launcher.exe").Path -ArgumentList "--headless", "--", "--launcher-update-test" -RedirectStandardOutput "update-out.txt" -RedirectStandardError "update-err.txt" -PassThru
          if (-not $process.WaitForExit(360000)) { $process.Kill(); throw "Update test timed out" }
          $text = (Get-Content "update-out.txt" -Raw) + (Get-Content "update-err.txt" -Raw)
          Write-Output $text
          if ($process.ExitCode -ne 0 -or $text -notmatch "LIVE_UPDATE_OK:" -or $text -match "SCRIPT ERROR:|ERROR:") { throw "Live update test failed" }
